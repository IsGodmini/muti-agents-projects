name: family_trip_planning
version: 1.3.0
description: 设计适合亲子家庭的可执行、多日文旅产品。
product_types:
  - family_trip
allowed_tools:
  - search_attractions
  - calculate_route_matrix
  - optimize_itinerary
  - calculate_product_cost
  - save_plan_version
  - submit_for_approval
quality_gates:
  max_daily_minutes: 480
  max_continuous_transport_minutes: 90
  fact_traceability_score: 90
  audience_fit_score: 85
max_retries: 2
approval_required: true
