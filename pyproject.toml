[project]
name = "tripops-api"
version = "0.1.0"
description = "TripOps AI multi-agent travel product planning backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.2,<2",
  "mcp>=1.28,<2",
  "ortools>=9.11,<10",
  "pillow>=12.3.0",
  "pydantic-settings>=2.7,<3",
  "reportlab>=5.0.0",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires external services (ComfyUI, LLM)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pypdf>=6.14.2",
]
